services:
  school:
    build: .
    restart: unless-stopped
    environment:
      SCHOOL_ORIGIN: "https://${SCHOOL_DOMAIN:?Set SCHOOL_DOMAIN in .env}"
      SCHOOL_ADMIN: "${SCHOOL_ADMIN:-mike}"
      SCHOOL_PASSWORD: "${SCHOOL_PASSWORD:?Set SCHOOL_PASSWORD in .env}"
    volumes:
      - courses:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SCHOOL_DOMAIN: "${SCHOOL_DOMAIN:?Set SCHOOL_DOMAIN in .env}"
    depends_on:
      school:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
volumes:
  courses:
  certificates:
  caddy-config:
